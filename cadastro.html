<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <title>Cadastro | Meu Ticket</title>
</head>
<body>
    <div>
        <p>
            <input type="text" id="Nome" placeholder="Nome" required>
        </p>
        <p>
            <input type="text" id="Usuario" placeholder="Usuário" required>
        </p>
        <p>
            <input type="password" id="Senha" placeholder="Senha" required>
            <i class="bi bi-eye-fill" id="btn-senha" onclick="mostrarSenha()"></i>
        </p>
        <p>
            <input type="password" id="ConfirmarSenha" placeholder="Confirmar senha" required>
            <i class="bi bi-eye-fill" id="btn-confirmar-senha" onclick="mostrarConfirmarSenha()"></i>
        </p>
        <p>
            <button id="btnCadastro">Cadastrar</button>
        </p>
        <p>
            <a href="login.html">Entrar</a>
        </p>
    </div>
    <script src="cadastro.js"></script>
</body>
</html>
